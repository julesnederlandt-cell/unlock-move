
name: Build UNLOCK Move APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'UNLOCK_Move_OneUpload.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          if [ ! -f "UNLOCK_Move_OneUpload.zip" ]; then
            echo "ERROR: UNLOCK_Move_OneUpload.zip not found in repository root."
            exit 1
          fi
          mkdir -p source
          unzip -o "UNLOCK_Move_OneUpload.zip" -d source

      - name: Build debug APK
        working-directory: source
        run: gradle assembleDebug

      - name: Find generated APK
        id: apk
        run: |
          APK_PATH="$(find source -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found after build."
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UNLOCK-Move-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
